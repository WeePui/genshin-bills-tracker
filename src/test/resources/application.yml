server:
  port: 0

spring:
  application:
    name: genshin-bills-tracker-test
  
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

app:
  storage:
    receipts-dir: ./target/test-receipts
  default-currency: USD
