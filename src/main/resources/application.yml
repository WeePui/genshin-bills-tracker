server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: genshin-bills-tracker
  
  datasource:
    url: jdbc:h2:file:./data/bills;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
      enabled: true

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

app:
  storage:
    receipts-dir: ./data/receipts
  default-currency: USD
