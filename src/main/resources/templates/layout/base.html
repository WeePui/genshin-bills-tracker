<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout (title, content)" th:lang="${currentLang ?: 'en'}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" id="metaThemeColor" content="#f6f0e2">
    <title th:replace="${title}">Genshin Bills Tracker</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">

    <!-- Synchronous Inline Theme Evaluation (Prevents FOUC) -->
    <script>
        (function() {
            try {
                const storedTheme = localStorage.getItem('theme');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                const isDark = storedTheme ? (storedTheme === 'dark') : (prefersDark !== false);
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                const meta = document.getElementById('metaThemeColor');
                if (meta) meta.content = isDark ? '#0b0f19' : '#f6f0e2';
            } catch (e) {}
        })();
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        genshin: {
                            gold: '#ecc94b',
                            dark: '#0b0f19',
                            card: '#131b2e',
                            border: '#1e293b',
                            accent: '#6366f1',
                            paper: '#f6f0e2',
                            parchment: '#fdfaf2',
                            ink: '#2c2416'
                        }
                    },
                    fontFamily: {
                        genshin: ['HYWenHei', 'Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Tesseract.js (Client-side OCR) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script th:src="@{/js/scanner.js}"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        @font-face {
            font-family: 'HYWenHei';
            src: url('/fonts/hywenhei_font.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        :root {
            /* Warm Antique Old Paper / Parchment Light Theme */
            --bg-body: #f6f0e2;
            --bg-header: rgba(248, 243, 233, 0.92);
            --border-main: #dfd3be;
            --bg-card: rgba(253, 249, 241, 0.94);
            --bg-subcard: rgba(243, 236, 221, 0.90);
            --text-primary: #2c2416;
            --text-secondary: #564835;
            --text-muted: #80705a;
            --border-card: #dfd3be;
            --input-bg: #fcf9f2;
            --input-border: #d4c7af;
            /* Crisp & clear background overlay (vivid scenery, no milky blur) */
            --overlay-gradient: linear-gradient(180deg, rgba(246, 240, 226, 0.22) 0%, rgba(242, 234, 216, 0.48) 100%);
        }

        html.dark {
            --bg-body: #0b0f19;
            --bg-header: rgba(13, 19, 34, 0.88);
            --border-main: rgba(30, 41, 59, 0.8);
            --bg-card: #131b2e;
            --bg-subcard: #0f172a;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border-card: #1e293b;
            --input-bg: #0f172a;
            --input-border: #334155;
            /* Clear dark overlay (scenery clearly visible) */
            --overlay-gradient: linear-gradient(180deg, rgba(11, 15, 25, 0.30) 0%, rgba(11, 15, 25, 0.60) 100%);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        /* Warm Antique Paper Styling for Light Theme (Easy on the eyes) */
        html:not(.dark) {
            background-color: var(--bg-body);
            color: var(--text-primary);
        }

        html:not(.dark) .bg-white,
        html:not(.dark) .bg-white\/90,
        html:not(.dark) .bg-white\/95,
        html:not(.dark) .bg-white\/80 {
            background-color: var(--bg-card) !important;
        }

        html:not(.dark) .bg-slate-50,
        html:not(.dark) .bg-slate-100,
        html:not(.dark) .bg-slate-50\/80,
        html:not(.dark) .bg-slate-100\/80,
        html:not(.dark) .bg-slate-100\/60 {
            background-color: var(--bg-subcard) !important;
        }

        html:not(.dark) .border-slate-200,
        html:not(.dark) .border-slate-300 {
            border-color: var(--border-card) !important;
        }

        html:not(.dark) .text-slate-900 {
            color: var(--text-primary) !important;
        }

        html:not(.dark) .text-slate-800,
        html:not(.dark) .text-slate-700 {
            color: var(--text-secondary) !important;
        }

        html:not(.dark) .text-slate-600,
        html:not(.dark) .text-slate-500 {
            color: var(--text-muted) !important;
        }

        html:not(.dark) header {
            background-color: var(--bg-header) !important;
            border-color: var(--border-card) !important;
        }

        html:not(.dark) #menuDropdown {
            background-color: var(--bg-card) !important;
            border-color: var(--border-card) !important;
        }

        html:not(.dark) input:not([type="checkbox"]):not([type="radio"]),
        html:not(.dark) select,
        html:not(.dark) textarea {
            background-color: var(--input-bg) !important;
            border-color: var(--input-border) !important;
            color: var(--text-primary) !important;
        }

        html:not(.dark) input:focus,
        html:not(.dark) select:focus,
        html:not(.dark) textarea:focus {
            border-color: #cca23b !important;
            outline: none;
            box-shadow: 0 0 0 2px rgba(204, 162, 59, 0.2) !important;
        }

        h1, h2, h3, h4, .font-genshin {
            font-family: 'HYWenHei', 'Plus Jakarta Sans', sans-serif;
            letter-spacing: 0.02em;
        }

        .glow-gold {
            box-shadow: 0 0 15px rgba(236, 201, 75, 0.25);
        }

        .theme-card {
            background-color: var(--bg-card);
            border-color: var(--border-card);
            color: var(--text-primary);
        }

        .theme-subcard {
            background-color: var(--bg-subcard);
            border-color: var(--border-card);
        }

        .theme-input {
            background-color: var(--input-bg);
            border-color: var(--input-border);
            color: var(--text-primary);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative transition-colors duration-200">

    <!-- Dynamic Genshin Impact Fullscreen Background -->
    <div th:if="${currentBackground != null && !currentBackground.empty}"
         class="fixed inset-0 -z-10 bg-cover bg-center bg-no-repeat bg-fixed transition-all duration-700 pointer-events-none"
         th:style="'background-image: var(--overlay-gradient), url(' + @{'/images/' + ${currentBackground}} + ');'">
    </div>

    <!-- Top Navigation Bar -->
    <header class="border-b border-slate-200 dark:border-slate-800/80 bg-white/90 dark:bg-[#0d1322]/85 backdrop-blur-md sticky top-0 z-40 transition-colors duration-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 sm:h-20">

                <!-- Left: Clean Logo & Main Functionality Navigation -->
                <div class="flex items-center space-x-4 sm:space-x-8">
                    <!-- Clean Logo (4x Enlarged, Dark Mode Inverted) -->
                    <a th:href="@{/dashboard}" class="flex items-center flex-shrink-0 transition transform hover:scale-105 active:scale-95 py-1" title="Dashboard">
                        <img th:src="@{/images/logo.png}" alt="Genshin Impact" class="h-10 sm:h-12 md:h-14 w-auto object-contain dark:invert drop-shadow-sm">
                    </a>

                    <!-- Main Navigation Links (Dashboard, Bills, Recovery) -->
                    <nav class="hidden md:flex items-center space-x-1">
                        <a th:href="@{/dashboard}" class="px-3.5 py-2 rounded-lg text-sm font-medium transition hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white"
                           th:classappend="${currentNav == 'dashboard' ? 'bg-slate-200 dark:bg-slate-800 text-amber-600 dark:text-amber-400 font-bold' : 'text-slate-600 dark:text-slate-300'}">
                            <span th:text="#{nav.dashboard}">Dashboard</span>
                        </a>
                        <a th:href="@{/bills}" class="px-3.5 py-2 rounded-lg text-sm font-medium transition hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white"
                           th:classappend="${currentNav == 'bills' ? 'bg-slate-200 dark:bg-slate-800 text-amber-600 dark:text-amber-400 font-bold' : 'text-slate-600 dark:text-slate-300'}">
                            <span th:text="#{nav.bills}">Bills & Proofs</span>
                        </a>
                        <a th:href="@{/recovery}" class="px-3.5 py-2 rounded-lg text-sm font-medium transition hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white"
                           th:classappend="${currentNav == 'recovery' ? 'bg-slate-200 dark:bg-slate-800 text-emerald-600 dark:text-emerald-400 font-bold' : 'text-slate-600 dark:text-slate-300'}">
                            <span th:text="#{nav.recovery}">Recovery</span>
                        </a>
                    </nav>
                </div>

                <!-- Right: Add Action Button, Controls & Menu Dropdown -->
                <div class="flex items-center space-x-2 sm:space-x-3">

                    <!-- Primary Action: + Add / Scan Bill (Moved to Right, Compact & Vertically Aligned) -->
                    <a th:href="@{/bills/new}"
                       class="inline-flex items-center justify-center gap-1.5 px-2.5 sm:px-3 py-1 sm:py-1.5 rounded-lg text-xs font-semibold sm:font-bold transition bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-sm shadow-amber-500/20 active:scale-95 leading-none">
                        <i class="fa-solid fa-plus text-[11px] leading-none flex-shrink-0"></i>
                        <span class="hidden sm:inline leading-none" th:text="#{nav.addBill}">Add / Scan Bill</span>
                    </a>

                    <!-- Language Switcher Pill -->
                    <div class="flex items-center border border-slate-300 dark:border-slate-700 rounded-lg p-0.5 bg-slate-100 dark:bg-slate-900 text-xs">
                        <button type="button" onclick="switchLanguage('en')"
                                class="px-2.5 py-1 rounded-md font-semibold transition"
                                th:classappend="${currentLang == 'vi' ? 'text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white' : 'bg-white dark:bg-slate-800 text-amber-500 shadow-sm font-bold'}">
                            EN
                        </button>
                        <button type="button" onclick="switchLanguage('vi')"
                                class="px-2.5 py-1 rounded-md font-semibold transition"
                                th:classappend="${currentLang == 'vi' ? 'bg-white dark:bg-slate-800 text-amber-500 shadow-sm font-bold' : 'text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white'}">
                            VI
                        </button>
                    </div>

                    <!-- Theme Toggle Button -->
                    <button type="button" onclick="toggleTheme()"
                            class="p-2 text-slate-600 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                            th:title="#{theme.toggle}" aria-label="Toggle Theme">
                        <i class="fa-solid fa-moon theme-icon-moon text-sm"></i>
                        <i class="fa-solid fa-sun theme-icon-sun text-sm text-amber-400 hidden"></i>
                    </button>

                    <!-- Menu Button & Floating Dropdown -->
                    <div class="relative" id="menuContainer">
                        <button type="button" onclick="toggleMenuDropdown(event)" id="menuBtn"
                                class="p-2 text-slate-600 hover:text-slate-900 dark:text-slate-300 dark:hover:text-white rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition flex items-center justify-center focus:outline-none"
                                th:classappend="${currentNav == 'accounts' || currentNav == 'settings' ? 'text-amber-500 dark:text-amber-400 bg-slate-100 dark:bg-slate-800' : ''}"
                                th:title="#{nav.menu}" aria-label="Menu" aria-expanded="false">
                            <i class="fa-solid fa-bars text-base"></i>
                        </button>

                        <!-- Floating Popover Dropdown Menu -->
                        <div id="menuDropdown"
                             class="hidden absolute right-0 mt-2 w-56 rounded-xl bg-white dark:bg-[#131b2e] border border-slate-200 dark:border-slate-800 shadow-2xl py-2 z-50 transition-all duration-150 backdrop-blur-lg">
                            
                            <!-- Mobile-only Main Links (shown on screens < md) -->
                            <div class="md:hidden pb-2 mb-2 border-b border-slate-200 dark:border-slate-800/80">
                                <div class="px-3 py-1 text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider" th:text="#{nav.main}">Main Navigation</div>
                                <a th:href="@{/dashboard}" class="flex items-center px-3 py-2 text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-800/60 rounded-lg mx-1 transition"
                                   th:classappend="${currentNav == 'dashboard' ? 'text-amber-600 dark:text-amber-400 font-bold bg-slate-100 dark:bg-slate-800/60' : 'text-slate-700 dark:text-slate-300'}">
                                    <i class="fa-solid fa-chart-pie mr-2.5 text-xs w-4 text-center"></i> <span th:text="#{nav.dashboard}">Dashboard</span>
                                </a>
                                <a th:href="@{/bills}" class="flex items-center px-3 py-2 text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-800/60 rounded-lg mx-1 transition"
                                   th:classappend="${currentNav == 'bills' ? 'text-amber-600 dark:text-amber-400 font-bold bg-slate-100 dark:bg-slate-800/60' : 'text-slate-700 dark:text-slate-300'}">
                                    <i class="fa-solid fa-receipt mr-2.5 text-xs w-4 text-center"></i> <span th:text="#{nav.bills}">Bills & Proofs</span>
                                </a>
                                <a th:href="@{/bills/new}" class="flex items-center gap-2.5 px-3 py-2 text-sm font-medium text-amber-600 dark:text-amber-400 hover:bg-amber-500/10 rounded-lg mx-1 transition leading-none">
                                    <i class="fa-solid fa-plus text-xs w-4 text-center leading-none"></i> <span class="leading-none" th:text="#{nav.addBill}">Add / Scan Bill</span>
                                </a>
                                <a th:href="@{/recovery}" class="flex items-center px-3 py-2 text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-800/60 rounded-lg mx-1 transition"
                                   th:classappend="${currentNav == 'recovery' ? 'text-emerald-600 dark:text-emerald-400 font-bold bg-slate-100 dark:bg-slate-800/60' : 'text-slate-700 dark:text-slate-300'}">
                                    <i class="fa-solid fa-shield-halved mr-2.5 text-xs w-4 text-center text-emerald-500"></i> <span th:text="#{nav.recovery}">Recovery Center</span>
                                </a>
                            </div>

                            <!-- Menu Items: Accounts and Settings -->
                            <div class="px-3 py-1 text-xs font-semibold text-slate-400 dark:text-slate-500 uppercase tracking-wider" th:text="#{nav.menu}">Menu</div>
                            <a th:href="@{/accounts}" class="flex items-center px-3 py-2 text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-800/60 rounded-lg mx-1 transition"
                               th:classappend="${currentNav == 'accounts' ? 'text-amber-600 dark:text-amber-400 font-bold bg-slate-100 dark:bg-slate-800/60' : 'text-slate-700 dark:text-slate-300'}">
                                <i class="fa-solid fa-user-shield mr-2.5 text-xs w-4 text-center text-amber-500"></i> <span th:text="#{nav.accounts}">Accounts</span>
                            </a>
                            <a th:href="@{/settings}" class="flex items-center px-3 py-2 text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-800/60 rounded-lg mx-1 transition"
                               th:classappend="${currentNav == 'settings' ? 'text-amber-600 dark:text-amber-400 font-bold bg-slate-100 dark:bg-slate-800/60' : 'text-slate-700 dark:text-slate-300'}">
                                <i class="fa-solid fa-sliders mr-2.5 text-xs w-4 text-center text-amber-500"></i> <span th:text="#{nav.settings}">Settings</span>
                            </a>
                        </div>
                    </div>

                </div>

            </div>
        </div>
    </header>

    <!-- Flash Alerts -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 w-full">
        <div th:if="${successMessage}" class="p-4 rounded-xl bg-emerald-100 dark:bg-emerald-950/60 border border-emerald-500/30 text-emerald-800 dark:text-emerald-300 flex items-center justify-between mb-4 shadow-sm">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-circle-check text-emerald-500 dark:text-emerald-400"></i>
                <span th:text="${successMessage}">Success message</span>
            </div>
            <button onclick="this.parentElement.remove()" class="text-emerald-500 hover:text-emerald-700 dark:text-emerald-400 dark:hover:text-emerald-200"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div th:if="${errorMessage}" class="p-4 rounded-xl bg-rose-100 dark:bg-rose-950/60 border border-rose-500/30 text-rose-800 dark:text-rose-300 flex items-center justify-between mb-4 shadow-sm">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-circle-exclamation text-rose-500 dark:text-rose-400"></i>
                <span th:text="${errorMessage}">Error message</span>
            </div>
            <button onclick="this.parentElement.remove()" class="text-rose-500 hover:text-rose-700 dark:text-rose-400 dark:hover:text-rose-200"><i class="fa-solid fa-xmark"></i></button>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full">
        <div th:replace="${content}">
            <!-- Page body replaced here -->
        </div>
    </main>

    <!-- Global Image Lightbox Modal -->
    <div id="imageLightbox" class="fixed inset-0 z-50 hidden bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
        <div class="relative max-w-5xl w-full max-h-[90vh] flex flex-col items-center">
            <button onclick="closeLightbox()" class="absolute -top-12 right-0 text-white hover:text-amber-400 text-2xl px-3 py-1">
                <i class="fa-solid fa-xmark"></i> <span th:text="#{common.close}">Close</span>
            </button>
            <img id="lightboxImg" src="" alt="Receipt Image" class="max-h-[80vh] max-w-full rounded-lg shadow-2xl object-contain border border-slate-700">
            <div class="mt-3 flex items-center space-x-4">
                <a id="lightboxDownloadBtn" href="#" download class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-sm border border-slate-600">
                    <i class="fa-solid fa-download mr-1"></i> <span th:text="#{common.viewOriginal}">Download Original</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t border-slate-200 dark:border-slate-800/80 bg-white/70 dark:bg-[#0d1322] py-6 mt-12 text-center text-xs text-slate-500 dark:text-slate-400 transition-colors">
        <div class="max-w-7xl mx-auto px-4">
            <p th:text="#{footer.text}">Genshin Bills Tracker &bull; 100% Local, Offline-First &bull; Tailored for HoYoverse Account Recovery</p>
        </div>
    </footer>

    <!-- Core Runtime Scripts (Theme, Language, Lightbox, Mobile Nav) -->
    <script>
        // 1. Language switcher helper (preserves URL query params)
        function switchLanguage(lang) {
            const url = new URL(window.location.href);
            url.searchParams.set('lang', lang);
            window.location.href = url.toString();
        }

        // 2. Theme switcher helper (persists to localStorage + updates UI)
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            syncThemeVisuals();
        }

        function syncThemeVisuals() {
            const isDark = document.documentElement.classList.contains('dark');
            const meta = document.getElementById('metaThemeColor');
            if (meta) meta.content = isDark ? '#0b0f19' : '#f6f0e2';

            document.querySelectorAll('.theme-icon-sun').forEach(el => {
                if (isDark) el.classList.remove('hidden'); else el.classList.add('hidden');
            });
            document.querySelectorAll('.theme-icon-moon').forEach(el => {
                if (isDark) el.classList.add('hidden'); else el.classList.remove('hidden');
            });
        }

        // React to OS-level theme changes if user hasn't explicitly set manual theme
        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
                if (!localStorage.getItem('theme')) {
                    if (e.matches) {
                        document.documentElement.classList.add('dark');
                    } else {
                        document.documentElement.classList.remove('dark');
                    }
                    syncThemeVisuals();
                }
            });
        }

        // Initialize icons on DOM ready
        document.addEventListener('DOMContentLoaded', syncThemeVisuals);

        // 3. Menu Dropdown Toggle & Event Handlers
        function toggleMenuDropdown(e) {
            if (e) e.stopPropagation();
            const dropdown = document.getElementById('menuDropdown');
            const btn = document.getElementById('menuBtn');
            if (!dropdown) return;
            const isHidden = dropdown.classList.toggle('hidden');
            if (btn) btn.setAttribute('aria-expanded', !isHidden);
        }

        // Close menu dropdown on outside click or Escape key
        document.addEventListener('click', function(e) {
            const container = document.getElementById('menuContainer');
            const dropdown = document.getElementById('menuDropdown');
            if (dropdown && !dropdown.classList.contains('hidden')) {
                if (container && !container.contains(e.target)) {
                    dropdown.classList.add('hidden');
                    const btn = document.getElementById('menuBtn');
                    if (btn) btn.setAttribute('aria-expanded', 'false');
                }
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const dropdown = document.getElementById('menuDropdown');
                if (dropdown && !dropdown.classList.contains('hidden')) {
                    dropdown.classList.add('hidden');
                    const btn = document.getElementById('menuBtn');
                    if (btn) btn.setAttribute('aria-expanded', 'false');
                }
            }
        });

        // 4. Lightbox modal
        function openLightbox(imageUrl, downloadUrl) {
            const modal = document.getElementById('imageLightbox');
            const img = document.getElementById('lightboxImg');
            const dlBtn = document.getElementById('lightboxDownloadBtn');
            img.src = imageUrl;
            dlBtn.href = downloadUrl || imageUrl;
            modal.classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('imageLightbox').classList.add('hidden');
            document.getElementById('lightboxImg').src = '';
        }

        document.getElementById('imageLightbox')?.addEventListener('click', function(e) {
            if (e.target === this) closeLightbox();
        });
    </script>
</body>
</html>
