<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: html}">
<head>
    <title th:text="${isNew ? 'New Genshin Account' : 'Edit Genshin Account'}">Account Form</title>
</head>
<body>
<div th:fragment="content" class="max-w-2xl mx-auto space-y-6">

    <!-- Header -->
    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <div>
            <h1 class="text-2xl font-bold tracking-tight text-white flex items-center space-x-2">
                <i class="fa-solid fa-user-shield text-amber-400"></i>
                <span th:text="${isNew ? 'Register Genshin Account' : 'Edit Account Profile'}">Account</span>
            </h1>
            <p class="text-sm text-slate-400 mt-1">Record your UID and account registration details for spending tracking and CS recovery.</p>
        </div>
        <a th:href="@{/accounts}" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs transition">
            <i class="fa-solid fa-arrow-left mr-1"></i> Back
        </a>
    </div>

    <!-- Form -->
    <form th:action="@{/accounts/save}" method="post" class="space-y-6">
        <input type="hidden" th:if="${!isNew}" th:field="${account.id}" />

        <div class="p-6 rounded-2xl bg-[#131b2e] border border-slate-800 shadow-lg space-y-4">

            <!-- UID & Server -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">
                        In-Game UID * <span class="text-amber-400 font-normal">(e.g. 800123456)</span>
                    </label>
                    <input type="text" th:field="${account.uid}" required placeholder="800123456"
                           class="w-full bg-slate-900 border border-slate-700 text-slate-200 font-mono text-sm rounded-lg p-2.5 focus:ring-amber-500 focus:border-amber-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Server Region *</label>
                    <select th:field="${account.server}" required
                            class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg p-2.5 focus:ring-amber-500 focus:border-amber-500">
                        <option th:each="srv : ${servers}"
                                th:value="${srv}"
                                th:text="${srv.displayName}">Server</option>
                    </select>
                </div>
            </div>

            <!-- Nickname -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">In-Game Nickname *</label>
                <input type="text" th:field="${account.nickname}" required placeholder="Traveler / Lumine / Aether"
                       class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg p-2.5 focus:ring-amber-500 focus:border-amber-500">
            </div>

            <!-- Recovery Profile Fields (HoYoverse CS Form) -->
            <div class="pt-4 border-t border-slate-800 space-y-4">
                <div class="flex items-center space-x-2 text-xs font-bold text-emerald-400 uppercase tracking-wider">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>HoYoverse Recovery Questionnaire Specs</span>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">
                            Registration / First Login Date
                        </label>
                        <input type="date" th:field="${account.registrationDate}"
                               class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg p-2.5 focus:ring-amber-500 focus:border-amber-500">
                        <span class="text-[11px] text-slate-500 mt-1 block">Check your Amber/Noelle join date or registration email.</span>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">
                            First Registration Device
                        </label>
                        <input type="text" th:field="${account.registrationDevice}" placeholder="e.g. PC (Windows 10, RTX 3060) or iPhone 13"
                               class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg p-2.5 focus:ring-amber-500 focus:border-amber-500">
                        <span class="text-[11px] text-slate-500 mt-1 block">The exact device model used to create the account.</span>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">
                        First Registration Method
                    </label>
                    <input type="text" th:field="${account.registrationMethod}" placeholder="e.g. HoYoverse Email Account, Google Account, Apple ID, Twitter"
                           class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg p-2.5 focus:ring-amber-500 focus:border-amber-500">
                </div>
            </div>

            <!-- Notes -->
            <div class="pt-2">
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Account Notes / History</label>
                <textarea th:field="${account.notes}" rows="3" placeholder="e.g. First 5-star character pulled, Adventure Rank milestones, linked email notes..."
                          class="w-full bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-lg p-2.5 focus:ring-amber-500 focus:border-amber-500"></textarea>
            </div>

        </div>

        <div class="flex items-center justify-between">
            <div>
                <button th:if="${!isNew}" type="button"
                        onclick="if(confirm('Delete this account and all associated purchase records?')) document.getElementById('deleteAccountForm').submit();"
                        class="px-4 py-2 bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 text-xs font-semibold rounded-lg border border-rose-800/40 transition">
                    <i class="fa-solid fa-trash mr-1"></i> Delete Account
                </button>
            </div>

            <div class="flex items-center space-x-3">
                <a th:href="@{/accounts}" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium transition">
                    Cancel
                </a>
                <button type="submit" class="px-6 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm shadow-lg transition flex items-center space-x-2">
                    <i class="fa-solid fa-floppy-disk"></i>
                    <span th:text="${isNew ? 'Create Account Profile' : 'Save Changes'}">Save</span>
                </button>
            </div>
        </div>
    </form>

    <form th:if="${!isNew}" id="deleteAccountForm" th:action="@{'/accounts/' + ${account.id} + '/delete'}" method="post" class="hidden"></form>

</div>
</body>
</html>
